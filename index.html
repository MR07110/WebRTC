<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My RTC - Monitoring Markazi</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="top-nav" class="back-nav" onclick="goHome()">
        <span class="chevron-left"></span>
        <span class="nav-text">Bosh sahifaga qaytish</span>
    </div>

    <div id="main-ui">
        <h1 class="main-title">Xavfsizlik Tizimi</h1>
        <div class="entry-buttons">
            <button class="btn btn-admin" onclick="openAdmin()">Admin Mode</button>
            <button class="btn btn-user" onclick="openUser()">User Mode</button>
        </div>
    </div>

    <div id="admin-panel" style="display:none;">
        <div class="status-bar">
            <span id="target-name">Qurilma tanlanmagan</span>
            <span id="battery-display" style="font-weight: bold; color: #27ae60;"></span>
        </div>

        <div class="card" style="background: #1e1e1e; color: #00ff00; font-family: monospace; height: 120px; overflow-y: auto; padding: 10px; margin-bottom: 15px; border-radius: 10px; font-size: 12px;">
            <h4 style="color: white; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 5px;">Qurilma Konsoli (Live Logs)</h4>
            <div id="console-logs">Ulanish kutilmoqda...</div>
        </div>

        <div class="card">
            <h4 class="card-title">GPS Monitoring</h4>
            <p id="location-display" class="data-text">Koordinatalar kutilmoqda...</p>
            <div id="map" style="height: 300px; width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid #ddd;"></div>
        </div>

        <div class="grid">
            <div class="video-box">
                <span class="video-label">KAMERA (OLD)</span>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
            <div class="video-box">
                <span class="video-label">EKRAN (SCREEN)</span>
                <video id="screenVideo" autoplay playsinline style="background: #222;"></video>
            </div>
        </div>

        <div class="controls-container">
            <div class="control-row" style="margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between;">
                <span class="control-label">Ovoz balandligi:</span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5" class="slider" style="flex: 1; margin-left: 15px;">
            </div>
            
            <div class="action-buttons" style="display: flex; gap: 10px;">
                <button id="flashBtn" class="btn" style="background: #f39c12; flex: 1;" onclick="toggleFlashlight()">FONARNI YOQISH</button>
                <button id="talkBtn" class="btn btn-talk" style="flex: 1;" onclick="toggleTalk()">GAPIRISH (Yopiq)</button>
            </div>
        </div>

        <div id="device-list-container" class="list-section">
            <h4 class="card-title">Onlayn qurilmalar</h4>
            <div id="device-list" class="list-grid">
                </div>
        </div>
    </div>

    <div id="user-ui" style="display:none; text-align:center; padding-top:100px;">
        <div class="card">
            <h2 style="color: #2ecc71;">Kuzatuv Faol</h2>
            <p>Admin hozirda ushbu qurilmani kuzatishi mumkin.</p>
            <br>
            <button class="btn" style="background:#e74c3c" onclick="goHome()">Kuzatuvni To'xtatish</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
