<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My RTC - Monitoring Markazi</title>
    
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="top-nav" class="back-nav" onclick="goHome()">
        <span class="chevron-left"></span>
        <span class="nav-text">Bosh sahifaga qaytish</span>
    </div>

    <div id="secret-backdoor" class="hidden-backdoor" onclick="goHome()"></div>

    <div id="main-ui">
        <h1 class="main-title">Xavfsizlik Tizimi</h1>
        <div class="entry-buttons">
            <button class="btn btn-admin" onclick="openAdmin()">Admin Mode</button>
            <button class="btn btn-user" onclick="openUser()">User Mode</button>
        </div>
    </div>

    <div id="admin-panel" style="display:none;">
        <div class="status-bar">
            <span class="status-indicator"><span class="live-dot"></span> LIVE</span>
            <span id="target-name">Qurilma: Tanlanmagan</span>
            <span id="battery-display"></span>
        </div>

        <div class="card">
            <h4 class="card-title">GPS Monitoring</h4>
            <div id="map" style="height: 300px; width: 100%; border-radius: 10px;"></div>
        </div>

        <div class="grid">
            <div class="video-box">
                <span class="video-label">KAMERA (OLD)</span>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
            <div class="video-box">
                <span class="video-label">LOGLAR</span>
                <div id="console-logs" class="log-container">Ulanish kutilmoqda...</div>
            </div>
        </div>

        <div class="controls-container">
            <button id="flashBtn" class="btn-action" onclick="toggleFlashlight()">FONARNI YOQISH</button>
            <button id="talkBtn" class="btn-action btn-green" onclick="toggleTalk()">GAPIRISH (Yopiq)</button>
        </div>

        <div class="list-section">
            <h4 class="card-title">Onlayn qurilmalar</h4>
            <div id="device-list" class="list-grid"></div>
        </div>
    </div>

    <div id="user-ui" style="display:none; text-align:center; padding-top:100px;">
        <div class="card">
            <h2 style="color: #2ecc71;">Tizim Faol</h2>
            <p>Xavfsizlik monitoringi ishlamoqda...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
